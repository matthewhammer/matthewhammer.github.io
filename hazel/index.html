<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- theme: head begin -->
<script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<!-- theme: head end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazel</title>
<style>
  :root { --bg: #fbfaf7; --paper: #ffffff; --ink: #1f2328; --muted: #5b6470; --line: #e3e0d8; --accent: #1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15171a; --paper: #1d2024; --ink: #e8e6e3; --muted: #a2a9b3; --line: #33373d; --accent: #93c5fd; }
  }
  :root[data-theme="dark"] { --bg: #15171a; --paper: #1d2024; --ink: #e8e6e3; --muted: #a2a9b3; --line: #33373d; --accent: #93c5fd; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 1.9em; margin: 0 0 18px; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 10px 0; }
  .what { color: var(--muted); margin-left: 0.4em; }
  .home { color: var(--muted); font-size: 0.92em; margin: 0 0 6px; }
</style>
</head>
<body>
<main>
  <p class="home"><a href="../">Matthew Hammer</a></p>
  <h1>Hazel</h1>
  <ul>
    <li><a href="https://hazel.org/">hazel.org</a><span class="what">Hazel itself</span></li>
    <li><a href="https://fumola.org/hazel-integration/">Fumola in Hazel</a><span class="what">on fumola.org</span></li>
    <li><a href="performance-analysis/">Hazel performance analysis</a><span class="what">the issues</span></li>
    <li><a href="work-dashboard/">work-dashboard</a><span class="what">what Matthew and Claude are working on, as it stands</span></li>
  </ul>
</main>
<!-- theme: begin -->
<style>
  .theme-toggle { position: fixed; top: 10px; right: 10px; z-index: 30; font: 13px system-ui, sans-serif; padding: 3px 10px;
    border-radius: 999px; border: 1px solid var(--line, #ccc); background: var(--paper, Canvas); color: var(--muted, GrayText);
    cursor: pointer; opacity: 0.85; }
  .theme-toggle:hover { opacity: 1; color: var(--ink, CanvasText); }
  @media print { .theme-toggle { display: none; } }
</style>
<script>
/* The theme switch: Auto (the system's choice), Light, Dark; remembered for this site. */
(() => {
  const order = ["auto", "light", "dark"], label = { auto: "◐ auto", light: "☀ light", dark: "☾ dark" };
  const get = () => { try { return localStorage.getItem("theme") || "auto"; } catch (_) { return "auto"; } };
  const apply = m => m === "auto" ? document.documentElement.removeAttribute("data-theme")
                                  : document.documentElement.setAttribute("data-theme", m);
  const b = document.createElement("button");
  b.type = "button"; b.className = "theme-toggle";
  const show = () => { const m = get(); b.textContent = label[m] || label.auto;
    b.title = "Theme: " + m + ". Click for " + order[(order.indexOf(m) + 1) % 3] + "; remembered on this site."; };
  b.addEventListener("click", () => {
    const m = order[(order.indexOf(get()) + 1) % 3];
    try { m === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", m); } catch (_) {}
    apply(m); show();
  });
  window.addEventListener("storage", e => { if (e.key === "theme") { apply(get()); show(); } });
  show(); document.body.append(b);
})();
</script>
<!-- theme: end -->
</body>
</html>
