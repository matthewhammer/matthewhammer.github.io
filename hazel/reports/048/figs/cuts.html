</rect><rect x="214.1" y="147.3" width="47.8" height="42.2" fill="#f87171" rx="1.5"><title>MakeTerm rebuilds the whole top-level term every step: 523 ms, 38% of the profile (527 ms, 29% before the fixes) (036#where (also 038#time); open)</title></rect><rect x="214.1" y="190.5" width="47.8" height="42.2" fill="#f87171" rx="1.5"><title>DefStatics walks the whole chain of definitions every step: 283 ms, 20% (289 ms, 16% before) (036#where (also 038#time); open)</title></rect><rect x="262.9" y="104.2" width="47.8" height="42.2" fill="#f87171" rx="1.5"><title>Building and rebuilding a small program: first build 338-366 ms; rebuild after an edit 138-154 ms whether a module changed or not; ~180 ms in the browser (043#cost; open)</title></rect><rect x="311.7" y="104.2" width="47.8" height="42.2" fill="#f87171" rx="1.5"><title>The page&#x27;s work after a livelit event (the program&#x27;s text changed and analysed again, the editor drawn), now most of an event: a click&#x27;s change 77 ms compiled vs 124 on Polygons; 319 vs 368 ms on Full Body; 304 vs 354 on the Witch; a drag step 36 vs 62 ms, while the livelit&#x27;s own update is ~0.05 ms (045#browser; open)</title></rect><rect x="262.9" y="147.3" width="47.8" height="42.2" fill="#f87171" rx="1.5"><title>The main thread&#x27;s own work on an edit before the request goes (update, a page view, statics and the request&#x27;s pieces): 0.31-0.41 s to the page&#x27;s first change (19-24 frames); 0.18-0.27 s before the request in the timeline run (046#witch-edit (also 046#witch-edit-parts); open)</title></rect><rect x="262.9" y="190.5" width="47.8" height="42.2" fill="#d1d5db" rx="1.5"><title>Nested module bindings multiply statics passes (3^depth on dev, 2^depth with #2651, counted from code): depth-9 function chain 31.04 and 29.59 s with #2651; 3.8-3.9x per level; depth-12 fix chain 197.2 s (024#next; other)</title></rect><rect x="311.7" y="147.3" width="47.8" height="42.2" fill="#d1d5db" rx="1.5"><title>Analysis of a module grows superlinearly with its members: 100 short members ~110 ms, 400 members ~2.3 s (4x the members, ~21x the time) (034#release-found (also 039#package); other)</title></rect><rect x="311.7" y="190.5" width="47.8" height="42.2" fill="#d1d5db" rx="1.5"><title>Initial build of the editor for a large program: 173 ms at 400 definitions up to 2,637 ms at 6,400 (036#scaling; other)</title></rect><rect x="18.0" y="48.0" width="343.4" height="186.7" fill="none" stroke="#2563eb" stroke-width="1"/><text x="21.0" y="58.0" font-size="9" fill="var(--ink)">re-analysis per edit (28)</text><rect x="19.0" y="247.7" width="44.2" height="46.9" fill="#15803d" rx="1.5"><title>The code editor re-checked every tile&#x27;s sort on every commit: check 16 ms, code editor 26 ms profiled (3-5 ms on the clock); 25,852 tiles per commit on mega-4k (001#now; fixed)</title></rect><rect x="64.2" y="247.7" width="44.2" height="46.9" fill="#15803d" rx="1.5"><title>Measuring the page after each redraw forced synchronous layouts and document-wide style recalcs: after-display effect 24 ms profiled; main-thread work 246 ms per release (001#now; fixed)</title></rect><rect x="109.3" y="247.7" width="44.2" height="46.9" fill="#15803d" rx="1.5"><title>The problems panel walked the whole program for incomplete tiles on every redraw: panel 13 ms, walk 6 ms profiled (001#now; fixed)</title></rect><rect x="154.5" y="247.7" width="44.2" height="46.9" fill="#15803d" rx="1.5"><title>A view re-evaluated every call though only one input changed: face&#x27;s first evaluation after a release 43 ms (median of 12) (001#pipeline; fixed)</title></rect><rect x="19.0" y="295.6" width="44.2" height="46.9" fill="#15803d" rx="1.5"><title>Every redraw evaluated every livelit&#x27;s view, changed or not: Kids&#x27; Choice 0.8 s (001#issues; fixed)</title></rect><rect x="64.2" y="295.6" width="44.2" height="46.9" fill="#15803d" rx="1.5"><title>Cursor info rebuilt the program&#x27;s source and compared it structurally on every redraw  x="19.0" y="443.2" width="40.7" height="50.9" fill="#f87171" rx="1.5"><title>Livelit views evaluated in each redraw: 44 ms profiled per release (face evaluation 21, its Html to the page 8, probe sample views 7, rest 8) (001#now; open)</title></rect><rect x="19.0" y="495.1" width="40.7" height="50.9" fill="#f87171" rx="1.5"><title>The app&#x27;s own update machinery (frame callbacks, recomputing its views): 25% of the page&#x27;s main thread (005#update; open)</title></rect><rect x="60.7" y="391.3" width="45.3" height="45.7" fill="#f87171" rx="1.5"><title>#2597 rebuilds the code editor&#x27;s view of the whole program on every update: 77% of the main thread during load (007#why; open)</title></rect><rect x="107.0" y="391.3" width="45.3" height="45.7" fill="#f87171" rx="1.5"><title>#2597 rebuilds the whole code view and prints the whole program to text on every change: code view 2.3 s, program to text 1.5 s (profiled) (008#a; open)</title></rect><rect x="153.4" y="391.3" width="45.3" height="45.7" fill="#f87171" rx="1.5"><title>Cells&#x27; livelit views drawn without the view memo: about 0.46 s per change profiled; updated 10-14: ~340 ms of profile, perhaps 0.1-0.2 s on the clock (008#b; open)</title></rect><rect x="60.7" y="438.0" width="38.7" height="53.5" fill="#f87171" rx="1.5"><title>Livelit views evaluated on the page inside the editor&#x27;s update: about 450 ms of a Full Body change&#x27;s ~1,010 ms of page JS (the update ~860 ms) (015#change; open)</title></rect><rect x="60.7" y="492.5" width="38.7" height="53.5" fill="#f87171" rx="1.5"><title>Opening slides: the page&#x27;s view: 55 s of 213 s of script (about 26%) over 58 slides; 30-40% on most slides (020#timing; open)</title></rect><rect x="100.4" y="438.0" width="48.6" height="42.6" fill="#f87171" rx="1.5"><title>Opening slides: layout: 13 s of 213 s (about 6%) (020#timing; open)</title></rect><rect x="150.0" y="438.0" width="48.6" height="42.6" fill="#f87171" rx="1.5"><title>Layout&#x27;s walk over the et program (017#pr2671 (also 001#issues); fixed)</title></rect><rect x="241.4" y="247.7" width="38.7" height="51.3" fill="#15803d" rx="1.5"><title>A recursive let&#x27;s own name leaked into its free variables, so nothing from the Drawing library on was reused: every woods change re-ran all 610,670 steps; ~3 s of a figure move (004#reuse; fixed)</title></rect><rect x="281.1" y="247.7" width="38.7" height="51.3" fill="#15803d" rx="1.5"><title>The view&#x27;s call memo cost more than it saved (8 entries per function, every call a miss, each paying for its key): a third of the view; woods figure size 6.1-7.3 s with the memo against 2.4-2.9 s without (004#memo; fixed)</title></rect><rect x="320.8" y="247.7" width="38.7" height="51.3" fill="#15803d" rx="1.5"><title>An open cell re-elaborated with fresh ids; the reuse check traced lexemes once per enclosing let (quadratic): about 2 s per change (122 slow checks of ~6,400-node subterms); GUI-only view 3.5 s against 1.2 s whole (008#reuse; fixed)</title></rect><rect x="241.4" y="300.0" width="38.7" height="51.3" fill="#86efac" rx="1.5"><title>The page checks the whole program for reuse on every dragged value&#x27;s preview: about 40% of the page&#x27;s time over a Full Body drag (profiled) (015#bridge; mitigated)</title></rect><rect x="241.4" y="352.3" width="38.7" height="51.3" fill="#f87171" rx="1.5"><title>Incremental evaluation saves nothing on a slider edit: Full Body 499 vs 464 ms from scratch, Witch 754 vs 701, Scenes 1,416 vs 1,453 (corrected 2026-10-13 to one protocol; conclusion unchanged) (009#reuse; open)</title></rect><rect x="281.1" y="300.0" width="38.7" height="51.3" fill="#f87171" rx="1.5"><title>Reuse works only per top-level binding, so nothing inside the picture is reused: incremental run skips 8-14% of a from-scratch run&#x27;s steps; 75-84% of its steps are in calls whose inputs did not change (steps, checks free) (010#work; open)</title></rect><rect x="320.8" y="300.0" width="38.7" height="51.3" fill="#f87171" rx="1.5"><title>Every slider edit re-evaluates the whole figure, even when the picture does not change: 85-95% of a from-scratch run (Full Body, Witch); 85-92% for the 22 edits that change no shape; 85.2-89.0% (012); a position-keyed update would cost 0.0-1.7% (steps) (011#sweep (also 012#trace); open)</title></rect><rect x="281.1" y="352.3" width="38.7" height="51.3" fill="#f87171" rx="1.5"><title>Per-step reuse check, run where no reuse is possible: 8.0% inclusive (025#in-hazel-s-library-and-evaluator; open)</title></rect><rect x="320.8" y="352.3" width="38.7" height="51.3" fill="#f87171" rx="1.5"><title>Each run&#x27;s new picture shares nothing with the last, so finding unchanged parts costs a whole walk: the merge 0.23 ms, as much as the whole view (0.24 ms), where a kept view would redo the neck&#x27;s 17 shapes in 0.043 ms (5x less) (046#witch-share; open)</title></rect><rect x="200.7" y="234.7" width="160.8" height="170.9" fill="none" stroke="#2563eb" stroke-width="1"/><text x="203.7" y="244.7" font-size="9" fill="var(--ink)">incremental reuse checks (12)</text><rect x="201.7" y="418.6" width="38.2" height="50.4" fill="#86efac" rx="1.5"><title>The recovering parser is quadratic on an unclosed bracket: 21-81 ms for well-formed modules, up to 1.8 s with an unclosed bracket (034#mudu; mitigated)</title></rect><rect x="240.9" y="418.6" width="38.2" height="50.4" fill="#facc15" rx="1.5"><title>Loading text the fast parser rejects: the fallback types it one character at a time, re-molding each time (quadratic): 182 s over 128 inputs; 8 KB of prose 64 s; 001 (with #2614): corpus 1,242 s, Kids&#x27; Choice 227 s (017#pr2610 (also 001#issues); open PR)</title></rect><rect x="201.7" y="469.9" width="51.3" height="37.5" fill="#facc15" rx="1.5"><title>The recovering parser inserts and re-grouts per character: parsing the 72 programs ~220 s; parse-heavy test groups 267 s (017#pr2614; open PR)</title></rect><rect x="201.7" y="508.5" width="51.3" height="37.5" fill="#f87171" rx="1.5"><title>Opening slides: building terms: 45 s of 213 s (about 21%) (020#timing; open)</title></rect><rect x="253.9" y="469.9" width="25.1" height="76.1" fill="#f87171" rx="1.5"><title>Opening slides: parsing: 41 s of 213 s (about 19%); Dynamic Row or Column 12.5 s, parsing 45% of it (020#timing; open)</title></rect><rect x="200.7" y="405.6" width="80.4" height="142.4" fill="none" stroke="#2563eb" stroke-width="1"/><text x="203.7" y="415.6" font-size="9" fill="var(--ink)">parsing on load (5)</text><rect x="282.1" y="418.6" width="38.2" height="50.4" fill="#15803d" rx="1.5"><title>The undo history kept a whole editor state per edit, uncapped by default: ~92 MB per edit (014; 89.0 MB in 038); 1,048 MB after 12 edits; capped at 2, ~290 MB (020) / 284 MB (038); of 390 MB kept over 4 edits: types and statics 119 MB, ValueHash 98, terms 64, decoded replies 46, layout 41; #26 (014#update (also 014#what, 020#undo, 036#question, 038#space); fixed)</title></rect><rect x="321.3" y="418.6" width="38.2" height="50.4" fill="#15803d" rx="1.5"><title>An undo or redo rebuilt the program&#x27;s syntax twice (RealizeView counted as an edit): undo 141 ms at 3,200 definitions, 263 at 6,400; redo 96 ms; a redo spent ~1.8x an edit&#x27;s time in CachedSyntax.mk (038#twice; fixed)</title></rect><rect x="282.1" y="469.9" width="51.3" height="37.5" fill="#86efac" rx="1.5"><title>Compaction&#x27;s price: restoring a compacted undo entry rebuilds its derived data: #2597: every redo 6.0-6.5 s against 2.7-3.1 s as built (014); undo 5.8 s, redo 6.1 s against a 6.9 s edit (038). #2635: redo 3.6-4.2 s (median 3.9), undos 3.5-5.1 s (014) or 3.6 s, 1.2-3.9 (038), against a 1.2 s edit (014#update (also 038#price); mitigated)</title></rect><rect x="282.1" y="508.5" width="51.3" height="37.5" fill="#f87171" rx="1.5"><title>The outline is rebuilt from scratch on every undo (its memo misses the restored program): 036: 211 ms, 15% of the profile, &#x27;~26 ms of each undo and redo&#x27; at 3,200 definitions. Corrected in 038 (2026-11-03 07:52): ~39 ms per undo at 3,200 definitions, 32-40% of an undo from 1,600 up (116 ms, 40%, at 6,400), ne (038#outline (also 036#twice, 036#where); open)</title></rect><rect x="334.3" y="469.9" width="25.1" height="76.1" fill="#f87171" rx="1.5"><title>The newest undo entry, kept whole for a fast undo, grows with the program: 0.55 MB at 400 definitions, 1.9 MB at 1,600, 6.9 MB at 6,400 (~1.1 KB a definition) vs ~0.01 MB compacted (038#persize; open)</title></rect><rect x="281.1" y="405.6" width="80.4" height="142.4" fill="none" stroke="#2563eb" stroke-width="1"/><text x="284.1" y="415.6" font-size="9" fill="var(--ink)">undo and history (5)</text><rect x="16.0" y="30.0" width="347.4" height="520.0" fill="none" stroke="#2563eb" stroke-width="2.5" rx="3"/><text x="20.0" y="43.0" font-size="11" font-weight="700" fill="#2563eb">Whole-program work on every edit (75)</text><rect x="366.4" y="61.0" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>Every request sent the worker the whole elaborated program and its statics table: 478 KB of Marshal per request; encoding ~52 ms on the main thread, decoding ~22 ms in the worker (profiled) (001#pipeline; fixed)</title></rect><rect x="410.6" y="61.0" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>Each worker result was sent whole; marshaling it took as long as evaluating: 393 KB result; marshaling 44 ms against evaluating 48 ms; page decoding 14 ms (profiled) (001#now; fixed)</title></rect><rect x="454.8" y="61.0" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>The builtin Html type written out in every ascription; Macro uses closed over all builtins: a slide&#x27;s request 609 KB (001#issues; fixed)</title></rect><rect x="366.4" y="107.4" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>After merging #2469 into #2635, a livelit release posted its changed definition whole, unshared: ~492 KB per release against ~16 KB shared; releases 20-30% slower (median 280 ms against 251.5 before) (020#merge469; fixed)</title></rect><rect x="410.6" y="107.4" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>The worker&#x27;s sharing pass hashes every value of its answer and finds almost nothing to share: 1.4-1.6 s a result (2.0-3.4 s on an arms edit with its stream); 0 references found on the arms edits, 242 on the neck; after two cuts 154-255 ms to save 0.46 -&gt; 0.42 MB, more than encoding and decoding (046#witch-trip (also 046#witch-cuts); fixed)</title></rect><rect x="454.8" y="107.4" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>Hashing and encoding the request on the main thread: Full Body hashing 3.88-4.21 ms, encoding 1.96-11.22 ms per release (encoding moved with the heap, not the work) (013#question; mitigated)</title></rect><rect x="366.4" y="153.8" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>(agenda only) A request to the worker without sharing: Full Body after one retyped number 1.95 MB in 260 ms whole vs 26.8 KB in 4 ms shared; Kids&#x27; Choice 494 vs 52 KB (037#2-how-much-sharing-is-lost-passing-data-to-and-f; mitigated)</title></rect><rect x="410.6" y="153.8" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>Encoding the worker&#x27;s answer with Marshal: 1.1-1.2 s for the 5.4 MB result (~0.22 s a MB) (046#witch-trip; mitigated)</title></rect><rect x="454.8" y="153.8" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>Decoding the worker&#x27;s answer on the main thread, one long task (Marshal back, references resolved, every new value hashed): 1.4-2.0 s for the 5.4 MB result (trip run); 1.9-3.1 s (timeline run), at least 116 frames frozen; 1.3-1.5 s for a 4.4 MB stream; ~0.32 s a MB (046#witch-edit-parts (also 046#witch-trip); mitigated)</title></rect><rect x="366.4" y="200.2" width="43.2" height="45.4" fill="#facc15" rx="1.5"><title>Elaborations keep every source node&#x27;s whitespace and comments, which nothing reads: requests 12-49% larger (five programs; probes.hz 48.0 vs 24.5 KB); 031: about a third of each program sent before #2608, and ~13.5% of the marshaled size still survives with it (through Typ.normalize) (017#prs (also 001#issues, 031#pr-2608); open PR)</title></rect><rect x="366.4" y="246.6" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>ValueHash&#x27;s memo: a hash for every object, in a WeakMap of about two million entries: 98 MB (25%) of what four edits kept on #2597; 9.8 of 37.5 MB on #2635; stopped heap snapshots finishing (014#snapshots; open)</title></rect><rect x="410.6" y="200.2" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>Decoded worker results lose object identity, so identity-keyed memos miss: 0 of 192 blocks (Kids&#x27; Choice) and 60 of 137 (Full Body) came back as the objects decoded before; costs little at this size (037) (038#precompact; open)</title></rect><rect x="454.8" y="200.2" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>(agenda only) The first send with sharing costs double: Full Body 624 ms shared vs 308 ms whole (037#2-how-much-sharing-is-lost-passing-data-to-and-f; open)</title></rect><rect x="410.6" y="246.6" width="43.2" height="45.4" fill="#d1d5db" rx="1.5"><title>The worker encoding its result for the page: about a third of the worker&#x27;s share of a woods change; result ~1 MB (004#cost; other)</title></rect><rect x="454.8" y="246.6" width="43.2" height="45.4" fill="#d1d5db" rx="1.5"><title>ShareCodec&#x27;s tables of values shared with the worker build up between resets: #2635 keeps 9 MB after one edit, 94 MB after ten, then 46 MB; cap 200,000 entries (014#update; other)</title></rect><rect x="365.4" y="48.0" width="134.5" height="246.0" fill="none" stroke="#9333ea" stroke-width="1"/><text x="368.4" y="58.0" font-size="9" fill="var(--ink)">serialization (15)</text><rect x="500.9" y="61.0" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>The evaluator re-applied itself to the run&#x27;s five constants at every call (a closure per node, js_of_ocaml&#x27;s generic call path): 30% of face view evaluation (~60 ms) (001#issues; fixed)</title></rect><rect x="545.1" y="61.0" width="43.2" height="45.4" fill="#15803d" rx="1.5"><title>Whole numbers carried back through Printf and big-integer parsing; tuple labels found by raising and catching an exception per label: about 2 µs a number; a list of 1,000 labeled points 8.2 ms back (045#diff; fixed)</title></rect><rect x="589.2" y="61.0" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>Converting a JS argument into Hazel at every call (no handles): 64x64 map 80.3 ms; 48.9 ms a call for a rule that ignores the map (029); 4,096 cells 66.5 ms converted each call (040) (029#report-27 (also 029#fix-world-passed, 040#handles); mitigated)</title></rect><rect x="500.9" y="107.4" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>A JS argument becomes Hazel syntax with a fresh id per node, is evaluated back, and is type-checked: time: 4,096 cells typed 139.2 ms, untyped 107.5 ms; 64 cells typed 1.49 ms (040#time; mitigated)</title></rect><rect x="545.1" y="107.4" width="43.2" height="45.4" fill="#86efac" rx="1.5"><title>The same boundary conversion: memory: 1,024 cells typed 80.4 MB a call, untyped 71.2 MB (040#space; mitigated)</title></rect><rect x="589.2" y="107.4" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>The evaluator under js_of_ocaml rather than wasm_of_ocaml: about 4x slower on fixed-precision work (001#next; open)</title></rect><rect x="500.9" y="153.8" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>Opening slides: js_of_ocaml&#x27;s runtime with no Hazel caller: 14 s of 213 s (about 7%) (020#timing; open)</title></rect><rect x="545.1" y="153.8" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>The call boundary&#x27;s floor: every call converts the whole JS argument to Hazel syntax, re-evaluates it, and checks its type: identity rule 8.54 ms at 16x16, 19.3 ms at 24x24; 13.8 ms vs 0.44 ms with no cells (~3 µs per node); the same rule in JS 0.003 ms (025#call (also 030#speed, 034#mudu); open)</title></rect><rect x="589.2" y="153.8" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>js_of_ocaml&#x27;s generic calls in the evaluator&#x27;s steps: caml_call_gen 7.9% + caml_call1 3.7% of self time (025#call; open)</title></rect><rect x="500.9" y="200.2" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>The least a call across the boundary costs, with a tiny argument: about 1 ms at every size (Hazel 1.27, Fumola 1.35 ms at 64x64); 0.889 ms vs 0.003 ms in JS (025) (027#numbers; open)</title></rect><rect x="500.9" y="246.6" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>js_of_ocaml turns each id&#x27;s 16 bytes into a JS string by hand: about three quarters of minting an id (of the 46% above) (029#ids; open)</title></rect><rect x="545.1" y="200.2" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>A call into a Hazel rule in the game: 3.5 ms median vs Fumola 1.6 ms; a lever pull 13.7 ms with Hazel, 10.7 with Fumola, 9.7 with JS (032#events (also 039#speed); open)</title></rect><rect x="589.2" y="200.2" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>A Hazel event-handler call through hazeljs vs the same handler in JS: about 3.3 ms a call (3.2-3.4; p90 ~4 ms) vs 0.7 µs in JS; 2,000 steps ~7 s; boundary/evaluation split not measured (045: the interpreter alone 358 µs on this rule) (043#cost; open)</title></rect><rect x="545.1" y="246.6" width="43.2" height="45.4" fill="#f87171" rx="1.5"><title>js_of_ocaml&#x27;s to_js, carrying the picture into JS: 0.88 ms of the 3.4 ms frame vs 0.08 ms building the same objects in plain JS (11x; different processes, rough) (046#witch-share; open)</title></rect><rect x="589.2" y="246.6" width="43.2" height="45.4" fill="#d1d5db" rx="1.5"><title>OCaml&#x27;s Printf under js_of_ocaml for number formatting: Witch view 1.01 ms via Printf.sprintf vs 0.19 ms via toFixed (5.3x) (046#witch; other)</title></rect><rect x="499.9" y="48.0" width="134.5" height="246.0" fill="none" stroke="#9333ea" stroke-width="1"/><text x="502.9" y="58.0" font-size="9" fill="var(--ink)">the JS boundary (15)</text><rect x="635.4" y="61.0" width="40.2" height="47.5" fill="#15803d" rx="1.5"><title>Building the request&#x27;s statics projection walked both statics maps whole (first blamed on hashing): 001: 17 ms profiled, first given as 15 ms of hashing; corrected 2026-10-14: hashing 1-4 ms. 013: 1.9-11.9 ms per release (Full Body 11.64-12.22 ms) (013#numbers (also 001#now); fixed)</title></rect><rect x="676.5" y="61.0" width="40.2" height="47.5" fill="#15803d" rx="1.5"><title>Collecting streamed results re-indexed the whole elaborated program after every commit: 44 ms profiled per release (001#issues; fixed)</title></rect><rect x="717.7" y="61.0" width="40.2" height="47.5" fill="#15803d" rx="1.5"><title>The worker&#x27;s answer carries its whole incremental cache, and the page sends it straight back: answers 86-98% larger than needed; one livelits answer 332 KB (017#pr2606 (also 001#issues, 005#fixes); fixed)</title></rect><rect x="635.4" y="109.5" width="51.9" height="36.7" fill="#15803d" rx="1.5"><title>The page rebuilt an index of the whole elaboration for each new evaluation: 204 ms of a 949 ms page update (profiled) (008#index; fixed)</title></rect><rect x="635.4" y="147.3" width="51.9" height="36.7" fill="#15803d" rx="1.5"><title>(agenda only) The worker reassembled the program from its pieces on every request: 47 ms on Full Body even when nothing changed (0.1 ms sent whole), 8 ms on Kids&#x27; Choice (037#2-how-much-sharing-is-lost-passing-data-to-and-f; fixed)</title></rect><rect x="635.4" y="185.0" width="51.9" height="36.7" fill="#15803d" rx="1.5"><title>The observation trace shipped to the page, where nothing reads it: 1.40 MB of the 5.4 MB result (1.27 MB the environments of 5 span-close events) (046#witch-answer; fixed)</title></rect><rect x="688.3" y="109.5" width="34.3" height="55.6" fill="#f87171" rx="1.5"><title>Each item&#x27;s spine root carries the whole program below it, so the request grows with how deep the edit is: 3.6 ms at item 26 of 167, 20.8 ms at item 134; 808 vs 5,768 nodes copied (~46 per item above the edit) (013#left; open)</title></rect><rect x="723.6" y="109.5" width="34.3" height="55.6" fill="#f87171" rx="1.5"><title>Moving the livelit views into the worker makes the final picture wait for the trip: final picture +0.28 s later in UX mode (8 of 10 rounds) (016#release; open)</title></rect><rect x="688.3" y="166.1" width="34.3" height="55.6" fill="#f87171" rx="1.5"><title>The eval worker&#x27;s own bookkeeping: WorkerMetrics.re 4.3 s + WorkerServer.re 6.2 s, about 10 s over 58 slides (020#timing; open)</title></rect><rect x="723.6" y="166.1" width="34.3" height="55.6" fill="#f87171" rx="1.5"><title>(agenda only) A one-literal edit re-sends about 10% of a chain of lets: about 10% of the program; every let around the edit hashes anew (042#1-undo-and-redo-in-o-log-n-in-space-and-in-time; open)</title></rect><rect x="634.4" y="48.0" width="125.5" height="175.7" fill="none" stroke="#9333ea" stroke-width="1"/><text x="637.4" y="58.0" font-size="9" fill="var(--ink)">the worker trip (10)</text><rect x="635.4" y="236.7" width="29.9" height="55.3" fill="#15803d" rx="1.5"><title>The worker yielded with setTimeout after every 5,000-step slice; chained timeouts clamp to ~4 ms: 5.8-6.2 s of a ~10 s woods change idle between 1,292 slices (3.9-4.4 s evaluating) (004#timeline; fixed)</title></rect><rect x="666.2" y="236.7" width="29.9" height="55.3" fill="#15803d" rx="1.5"><title>Stream messages swamped the page (a full update per message): page busy 45.5 s after opening a 1,000-item program; 46.7 s for 2,000 (005#fixes; fixed)</title></rect><rect x="697.1" y="236.7" width="29.9" height="55.3" fill="#15803d" rx="1.5"><title>#2597 runs a full page update for every stream message, and its worker posts after every slice: 2,520 d Eyes (004#casts; other)</title></rect><rect x="365.4" y="314.0" width="197.2" height="122.5" fill="none" stroke="#ea580c" stroke-width="1"/><text x="368.4" y="324.0" font-size="9" fill="var(--ink)">ids on every term (11)</text><rect x="366.4" y="449.6" width="38.0" height="47.7" fill="#15803d" rx="1.5"><title>The evaluator unrolled the recursive Html type (47 constructors) at every Html node: a sixth of the page&#x27;s time in the woods; an uncached check another 5% (004#casts; fixed)</title></rect><rect x="366.4" y="498.3" width="38.0" height="47.7" fill="#15803d" rx="1.5"><title>Giving a value a type rebuilt it whole at every typed boundary, and the call memo re-keyed the copies: woods picture (15,500 nodes) copied; about a quarter of the view every redraw; memo keys copied the picture three times per change (006); 2,000 tuples passed 30 times 382 ms (dev microbenchmark) (004#update (also 006#update, 017#pr2679); fixed)</title></rect><rect x="405.5" y="449.6" width="38.0" height="47.7" fill="#15803d" rx="1.5"><title>#2681&#x27;s type memo is asked at every part of every fresh argument (all misses), raising the floor: floor 8.54 -&gt; 10.1 ms at 16x16 (+18%; +9% in the floor driver); per call 4,137 memo lookups (all misses), 2,580 writes, 6,734 type-hash lookups (025#floor; fixed)</title></rect><rect x="405.5" y="498.3" width="38.0" height="47.7" fill="#15803d" rx="1.5"><title>A list loop re-types its whole list every iteration (an ascription pushed through every element, a fresh term and id each): building and summing 3,000 numbers 4,591 ms vs Fumola&#x27;s 24.7 ms (186x); mapinc 103x; 60% of sumbuild(1000)&#x27;s profile inside Ascriptions.re (029#re-type; fixed)</title></rect><rect x="444.5" y="449.6" width="38.0" height="47.7" fill="#facc15" rx="1.5"><title>Ascribing a constructor application compares two copies of the same sum type in full (the Html type, at every node of a view): Polygons click 15-17 s profiled, the ascription step 88% of it; dev benchmark x="1.5"><title>Jumping to a projector walked the caret token by token: ~190 ms per projector click (001#issues; fixed)</title></rect><rect x="764.9" y="504.6" width="38.0" height="41.4" fill="#15803d" rx="1.5"><title>Slide code found the head&#x27;s frame per point instead of once: Eyes sliders 1.5-1.8 s (002#face; fixed)</title></rect><rect x="803.9" y="462.1" width="38.0" height="41.4" fill="#15803d" rx="1.5"><title>Autosave prints the whole program inside the change; with probes the print was quadratic in top-level items: about 600 ms a change (whole program) and about 1 s (GUI only); updated 2026-10-14 from 0.55 s (008#update; fixed)</title></rect><rect x="803.9" y="504.6" width="38.0" height="41.4" fill="#15803d" rx="1.5"><title>The app evaluated the whole livelit definition on every event before applying its update: 68.3-83.3 ms per event for the Polygons livelit (its update alone 0.67-5.18 ms); a drag step 80.7 ms (045#diff; fixed)</title></rect><rect x="842.9" y="462.1" width="38.0" height="41.4" fill="#f87171" rx="1.5"><title>Hands redraw grows with the finger count (not profiled): about 0.3 s per finger; 99 fingers 32.30 s against 5 ms in the game; 100 claws 8.19 s (003#cost; open)</title></rect><rect x="882.0" y="462.1" width="38.0" height="41.4" fill="#f87171" rx="1.5"><title>The library&#x27;s size and load: hazel-lib.js 2.8 MB; page load ~525 vs 270 ms (Hazel vs JS); heap 67 vs 51 MB; 643 KB over the wire (034) (025#t-game (also 034); open)</title></rect><rect x="842.9" y="504.6" width="38.0" height="41.4" fill="#f87171" rx="1.5"><title>Hazel&#x27;s tiles in the game: a whole Hazel app per script box, made one at a time: ~3.7 s for six boxes (3.0-4.5 s); the run ~4 s longer than with JS (17.4 vs 13.1 s) (032#table; open)</title></rect><rect x="882.0" y="504.6" width="38.0" height="41.4" fill="#f87171" rx="1.5"><title>hazel-jit&#x27;s own output: an array per call of a tuple function, generic equality, no loops for tail calls, boxed options: 1.59 µs a c
