<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
<style>.h{fill:#0e7490;font:700 13px system-ui,sans-serif}.t{fill:#0d9488}.p{fill:#2563eb}.g{fill:#9ca3af}.f{stroke:#15803d;stroke-width:2.5}.fl{fill:#15803d;font:700 10px system-ui,sans-serif}.l{fill:#1f2328;font:11px system-ui,sans-serif}.m{fill:#6b7280;font:10px system-ui,sans-serif}.ax{stroke:#d1d5db;stroke-width:1}
</style>
<text class="h" x="16" y="22">a slider's step, run compiled</text>
<line class="ax" x1="16" y1="176" x2="304" y2="176"/>
